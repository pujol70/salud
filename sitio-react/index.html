    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "name": "ECRISTIA",
          "description": "Diseño web, desarrollo y mantenimiento mensual para negocios de Asunción y Gran Asunción.",
          "telephone": "+595982829875",
          "email": "ecristiamz@gmail.com",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Asunción",
            "addressRegion": "Gran Asunción",
            "addressCountry": "PY"
          },
          "priceRange": "Gs. 1.900.000 - Gs. 7.500.000",
          "currenciesAccepted": "PYG",
          "paymentAccepted": "Transferencia bancaria, 50% anticipo y 50% contra entrega",
          "areaServed": "Asunción y Gran Asunción"
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "¿Tengo que tener los textos listos?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Yo redacto los textos a partir de una entrevista de 30 minutos."
              }
            },
            {
              "@type": "Question",
              "name": "Ya tengo Instagram, ¿para qué una web?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "La web es donde llega quien te busca en Google o quien te recomendaron y quiere ver más información. No reemplaza a Instagram, lo complementa."
              }
            },
            {
              "@type": "Question",
              "name": "¿Qué incluye el hosting y el dominio?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Todos los tipos de web incluyen hosting por 1 año. El dominio .com también, si todavía no tienes uno. Si ya tienes dominio, puedes usarlo, pero el precio es el mismo. Pasado el primer año, el hosting sigue con un plan de mantenimiento."
              }
            },
            {
              "@type": "Question",
              "name": "¿Das factura?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sí, emito factura electrónica y todos los precios incluyen IVA."
              }
            },
            {
              "@type": "Question",
              "name": "¿Y si mi web la hizo otra persona que ya no responde?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Puedo hacerme cargo: reviso la web, hago una copia de seguridad, la actualizo y pasa al plan de mantenimiento Pro. El cargo inicial es de Gs 400.000."
              }
            }
          ]
        }
      ]
    }
