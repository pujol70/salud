              "@type": "Question",

              }

              "@type": "Question",

                "@type": "Answer",
                "text": "La web recibe a quien llega desde Google o por recomendación formal. No reemplaza Instagram, lo complementa con credibilidad y posicionamiento."
              }
            },
            {
              "@type": "Question",
              "name": "¿Qué incluye el hosting y el dominio?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "El hosting va incluido por 1 año en todos los tipos de web. El dominio .com también, si aún no tienes uno. Si ya tienes dominio, el precio no cambia: no hay descuento por traer el tuyo. Después del primer año pasas al plan de mantenimiento."
              }
            },
            {
              "@type": "Question",
              "name": "¿Facturas?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sí, con IVA incluido en todos los precios publicados."
              }
            },
            {
              "@type": "Question",
              "name": "¿Y si mi web actual la hizo otra persona y no responde?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Puedo rescatarla: auditoría, copia de seguridad, actualización técnica y alta en el plan Pro con un cargo inicial de Gs 400.000."

            }
